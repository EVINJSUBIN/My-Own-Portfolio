<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Evin Jacob Subin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-bg"></div>

  <header class="topbar">
    <div class="brand-box">Evin</div>
    <nav class="nav-bunch">
      <a href="index.html" class="nav-banana">home</a>
      <a href="projects.html" class="nav-banana">works</a>
      <a href="contact.html" class="nav-banana active">hello</a>
    </nav>
  </header>

  <main class="main-shell contact-shell">
    <section class="big-card contact-box">
      <p class="tiny-label">say hi, ask something, or just send a random idea</p>
      <h1 class="big-title smaller">hello there</h1>

      <form class="contact-form" id="mini-form">
        <label>
          name
          <input type="text" name="name" placeholder="your name" required>
        </label>

        <label>
          email
          <input type="email" name="email" placeholder="your email" required>
        </label>

        <label>
          message
          <textarea name="message" rows="5" placeholder="what you want to build" required></textarea>
        </label>

        <button type="submit" class="send-btn">send it</button>
      </form>
    </section>

    <aside class="side-stack">
      <div class="mini-card">
        <p class="mini-head">quick links</p>
        <div class="link-stack">
          <a href="mailto:evinjsubin@gmail.com">email</a>
          <a href="https://github.com/EVINJSUBIN" target="_blank" rel="noopener noreferrer">github</a>
          <a href="https://www.instagram.com/e_v_i_n_j_s_u_b_i_n/" target="_blank" rel="noopener noreferrer">instagram</a>
        </div>
      </div>

      <div class="mini-card mini-card-warm">
        <p class="mini-head">status</p>
        <p class="mini-text" id="form-status">quietly available for cool projects.</p>
      </div>
    </aside>
  </main>

  <footer class="footer-box">
    <p>© 2026 Evin Jacob Subin — if you need me, just say hi.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
